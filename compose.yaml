services:
  revive:
    build: ./revive
    init: true
    ports:
      - "127.0.0.1:${CGANY_PORT:-8000}:8000"
    volumes:
      - ${CGANY_DATA:?在 .env 設定 CGANY_DATA}/cgany_archive:/data/cgany_archive:ro
      - ${CGANY_DATA:?在 .env 設定 CGANY_DATA}/cgany_com_archive:/data/cgany_com_archive:ro
      - ${CGANY_DATA:?在 .env 設定 CGANY_DATA}/cgany_build/override:/data/override:ro
      - ${CGANY_DATA:?在 .env 設定 CGANY_DATA}/cgany_build/vbb:/data/vbb:ro
      - ${CGANY_DATA:?在 .env 設定 CGANY_DATA}/logs:/data/logs
    environment:
      BASE_DOMAIN: "${BASE_DOMAIN:-}"
      SUBDOMAIN_SEP: "${SUBDOMAIN_SEP:-}"
      PUBLIC_SCHEME: "${PUBLIC_SCHEME:-}"
      AGE_GATE: "${AGE_GATE:-}"
      MASK_EMAILS: "${MASK_EMAILS:-}"
      WAYBACK_EXTERNAL: "${WAYBACK_EXTERNAL:-0}"
      PRIVATE_PAGES: "${PRIVATE_PAGES:-0}"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    logging:
      options: {max-size: 10m, max-file: "3"}
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:-}"
    depends_on:
      - revive
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      options: {max-size: 10m, max-file: "3"}
    restart: unless-stopped
